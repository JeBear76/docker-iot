name: mini workflow

on:
  workflow_dispatch:
    inputs:
      IsProd:
          type: boolean
          required: true      
env:
  VERSION_CODE: 1
  
jobs:
  do-thing:
    runs-on: ubuntu-latest
    steps:
    - name: Step 1
      run: |
        echo $VERSION_CODE >> ./test
    
    - name: conditonal
      run: |
        if [ ${{ inputs.IsProd }} = true ]; then
          VERSION_CODE=$((${{ github.run_number }} + ${{ env.VERSION_CODE }}))
          echo $VERSION_CODE >> ./test
        fi

    - name: view versionCode
      run: cat ./test
      
  
